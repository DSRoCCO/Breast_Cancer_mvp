name: Container validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build reproducible image
        run: docker build --tag breast-cancer-mvp:ci .
      - name: Start container on loopback
        run: docker run --detach --name breast-cancer-mvp-ci --publish 127.0.0.1:3838:3838 breast-cancer-mvp:ci
      - name: Verify Shiny health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3838/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs breast-cancer-mvp-ci
          exit 1
      - name: Show logs and remove container
        if: always()
        run: |
          docker logs breast-cancer-mvp-ci || true
          docker rm --force breast-cancer-mvp-ci || true
